<div class="row mb-3">
    <label for="letter" class="col-xl-3 control-label">
        {_lang_letter}
    </label>
    {EXPLODE}
    <div class="col-xl-5">
        <input class="form-control"
               type="text"
               id="letter"
               name="letter"
               size="2"
               maxlength="1"
               value="" />
    </div>
    <div class="col-xl-4">
        <input type="submit" class="btn btn-outline-primary float-end" name="submit" id="submit" value="{_lang_guess}" />
    </div>
    {EXPLODE}
    <div class="col-xl-9">
        {EXPLODE}
        <div class="btn-group col-xl-12" role="group" aria-label="Basic example">
            {EXPLODE}
            <button type="submit" class="btn btn-outline-primary" id="letter" name="letter" value="{id}"{disabled}>{name}</button>
            {EXPLODE}
        </div>
        {EXPLODE}
    </div>
    {EXPLODE}
</div>
